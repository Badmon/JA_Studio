<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Los valores %SITE_…% se completan al compilar desde src/data/siteConfig.ts -->
    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta name="author" content="%SITE_NAME%" />
    <meta name="theme-color" content="#F4F3EF" />
    <!-- Aplica el tema (claro/oscuro) antes de pintar la página, para evitar un parpadeo.
         Usa la preferencia guardada o, si no hay, la del sistema. Ver src/lib/theme.ts. -->
    <script>
      ;(function () {
        var theme
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#121211' : '#F4F3EF'
      })()
    </script>
    <meta name="robots" content="index, follow" />
    <!-- Verificación de propiedad en Google Search Console. No borrar: sin ella se pierde el acceso. -->
    <meta name="google-site-verification" content="N00M4pVCK27KPXOTN2qkvuUF7gyAZOzkhe4J_gHW0Wk" />
    <!-- %SITE_URL_TAGS% -->
    <!-- %SITE_JSON_LD% -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SITE_TITLE%" />
    <meta name="twitter:description" content="%SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_OG_IMAGE%" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
