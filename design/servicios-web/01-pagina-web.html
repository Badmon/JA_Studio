<style>
  @font-face { font-family: 'Manrope Variable'; src: url('../../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2') format('woff2'); font-weight: 200 800; }
  :root { --bg:#121211; --surface:#232321; --ink:#f4f3ef; --soft:#b9b6ae; --muted:#928f88; --accent:#c2e66e; --carbon:#111; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { position: relative; font-family: 'Manrope Variable', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; }
  svg.ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dots { inset: 0; background-image: radial-gradient(rgb(244 243 239 / .13) 1.5px, transparent 1.6px); background-size: 36px 36px; -webkit-mask-image: radial-gradient(ellipse 75% 70% at 62% 62%, #000 20%, transparent 78%); mask-image: radial-gradient(ellipse 75% 70% at 62% 62%, #000 20%, transparent 78%); }
  .glow { border-radius: 50%; background: radial-gradient(closest-side, rgb(194 230 110 / .22), transparent); }
  .bigj { fill: rgb(194 230 110 / .14); }
  h1 { font-weight: 800; line-height: .98; letter-spacing: -.045em; }
  h1 em { font-style: normal; position: relative; display: inline-block; z-index: 0; color: #111; }
  h1 em::before { content: ''; position: absolute; z-index: -1; left: -14px; right: -14px; top: 12%; bottom: 2%; background: var(--accent); border-radius: 22px; }
  .lead { font-weight: 600; letter-spacing: -.02em; color: var(--soft); line-height: 1.3; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .mark { width: 54px; height: 54px; border-radius: 15px; background: var(--ink); display: grid; place-items: center; }
  .mark svg { width: 30px; height: 30px; fill: var(--bg); }
  .btn { display: inline-flex; align-items: center; gap: 14px; height: 74px; padding: 0 8px 0 28px; border-radius: 999px; font-size: 28px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; background: #fff; color: #111; }
  .btn .wa { width: 34px; height: 34px; fill: #25d366; margin-left: -4px; }
  .btn .arrow { width: 58px; height: 58px; border-radius: 50%; background: #111; color: #fff; display: grid; place-items: center; }
  .btn .arrow svg { width: 26px; height: 26px; stroke-width: 2.25; }

  /* Dispositivos */
  .monitor .screen { background: #111; border-radius: 20px; padding: 12px 12px 22px; box-shadow: 0 0 0 1px rgb(244 243 239 / .14), 0 30px 60px -24px rgb(0 0 0 / .8); }
  .monitor .screen img { display: block; width: 100%; object-fit: cover; object-position: top; border-radius: 8px; }
  .monitor .neck { margin: 0 auto; width: 18%; height: 62px; background: linear-gradient(90deg, #2a2a27, #3d3d38 50%, #2a2a27); clip-path: polygon(14% 0, 86% 0, 100% 100%, 0 100%); }
  .monitor .foot { margin: -1px auto 0; width: 44%; height: 12px; background: linear-gradient(#3d3d38, #26261f); border-radius: 0 0 10px 10px; box-shadow: 0 18px 28px -10px rgb(0 0 0 / .8); }
  .laptop .screen { background: #111; border-radius: 18px 18px 6px 6px; padding: 11px 11px 15px; box-shadow: 0 0 0 1px rgb(244 243 239 / .14), 0 24px 50px -20px rgb(0 0 0 / .8); }
  .laptop .screen img { display: block; width: 100%; object-fit: cover; object-position: top; border-radius: 7px; }
  .laptop .base { margin: 0 -4%; height: 18px; background: linear-gradient(#3a3a36, #2a2a27); border-radius: 0 0 24px 24px; position: relative; box-shadow: 0 22px 30px -14px rgb(0 0 0 / .8); }
  .laptop .base::before { content: ''; position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 24%; height: 7px; background: #1c1c1a; border-radius: 0 0 10px 10px; }
  .tablet { background: #111; padding: 11px; border-radius: 26px; box-shadow: 0 0 0 1px rgb(244 243 239 / .2), 0 30px 54px -16px rgb(0 0 0 / .85); }
  .tablet img { display: block; width: 100%; object-fit: cover; object-position: top; border-radius: 15px; }
  .phone { background: #111; padding: 7px; border-radius: 30px; box-shadow: 0 0 0 1px rgb(244 243 239 / .22), 0 30px 54px -14px rgb(0 0 0 / .85); }
  .phone .scr { position: relative; border-radius: 24px; overflow: hidden; background: #fff; }
  .phone .scr img { display: block; width: 100%; object-fit: cover; object-position: top; }
  .phone .notch { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: 34%; height: 8px; border-radius: 99px; background: #111; }

  h1 { left: 64px; top: 70px; font-size: 108px; }
  .lead { left: 64px; top: 322px; font-size: 32px; width: 700px; }
</style>
